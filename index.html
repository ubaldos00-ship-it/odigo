<body>

<!-- 상단: 로고 + 검색 -->
<header class="topbar">
  <div class="logo">어디고</div>
  <form id="searchForm" class="search" autocomplete="off">
    <input id="searchInput" type="search" placeholder="장소·주소 검색 (예: 고령군청, 대가야읍 지산리 123)" enterkeyhint="search">
    <button type="submit" aria-label="검색">검색</button>
  </form>
</header>
<div id="searchResults" class="search-results" hidden></div>

<!-- 지도 -->
<div id="map"></div>

<!-- 지도 오른쪽 버튼 -->
<div class="fab-col">
  <button id="btnNearby" class="fab" title="주변정보"><span>🧭</span><small>주변정보</small></button>
  <button id="btnBase" class="fab" title="배경지도 전환"><span>🛰️</span><small>위성</small></button>
  <button id="btnLocate" class="fab" title="내 위치"><span>📍</span><small>내 위치</small></button>
</div>

<!-- 하단 바 -->
<nav class="bottombar">
  <button id="btnToday" class="bb-btn"><b>오늘 방문</b> <span id="cntToday">0</span></button>
  <button id="btnPlaces" class="bb-btn"><b>내 조사 장소</b> <span id="cntPlaces">0</span></button>
  <button id="btnInfo" class="bb-btn small" aria-label="정보">ⓘ</button>
</nav>

<!-- 접속 카운터 (텐아르 방식) -->
<div class="counter-strip" aria-label="접속 통계">
  실시간 <strong id="realtimeCount">…</strong> · 오늘 <strong id="todayCount">…</strong> · 누적 <strong id="totalCount">…</strong> · 조회 <strong id="pageviewCount">…</strong>
</div>

<!-- 하단 시트 (장소 목록·장소 카드·주변정보·정보 공용) -->
<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>

  <div class="sheet-head">
    <div id="sheetTitle" class="sheet-title"></div>
    <button id="sheetClose" class="sheet-close" aria-label="닫기">✕</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<div id="toast" class="toast" hidden></div>
