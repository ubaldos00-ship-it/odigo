<!doctype html>
<!-- 어디고 odigo v1.7 (2026-11-05) 0단계 기본 지도 — MapLibre+VWorld 배경(일반/위성), 장소 검색(카카오 장소·주소), 내 조사 장소 저장·오늘 방문·방문 기록(localStorage, 서버 전송 없음), 외부 길찾기(네이버·카카오·T맵), 「주변정보」 패널 틀(주차장·CCTV·교통·치안 — 실제 API 연결 전이라 전부 비활성·「준비 중」 표시, 가짜 자료 없음). 하단 접속 카운터 유지. 설계: 설계/v1.1 -->
<!-- (이전) 어디고 odigo v1.6 (2026-11-05) PNG 아이콘을 img/ 폴더로 정리, 경로 수정 + ?v=3. favicon.ico·manifest는 맨 위 유지 -->
<!-- (이전) 어디고 odigo v1.5 (2026-11-05) 하단 카운터를 어디고 GA4 Apps Script(/exec)에 연결 — 실시간·오늘·누적·조회수 표시 -->
<!-- (이전) 어디고 odigo v1.4 (2026-11-05) 즐겨찾기 제목을 「어디고」로 변경(<title>) -->
<!-- (이전) 어디고 odigo v1.3 (2026-11-05) 즐겨찾기·홈화면 아이콘이 두당으로 나오던 문제 수정 — 어디고 아이콘(favicon.ico·16/32·apple-touch-icon·192/512)+manifest, ?v=2 캐시 무효화, 앱 이름 어디고 -->
<!-- (이전) 어디고 odigo v1.2 (2026-11-05) 하단 접속 카운터 추가(텐아르 방식: GA4 Apps Script 서버값 — 실시간·오늘·누적·조회수). GAS_URL 비어 있으면 '–' 표시 -->
<!-- (이전) 어디고 odigo v1.1 (2026-11-05) Google Analytics 추가 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6GZCBFEGQ0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-6GZCBFEGQ0');
</script>
<title>어디고</title>
<meta name="description" content="어디고 — 조사 장소를 찾고 저장하며 현장 방문을 지원하는 지도 (위치 현장조사지원)">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png?v=3">
<link rel="apple-touch-icon-precomposed" href="img/apple-touch-icon-precomposed.png?v=3">
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="img/odigo-192.png?v=3">
<link rel="shortcut icon" href="favicon.ico?v=3">
<link rel="manifest" href="odigo.webmanifest">
<meta name="apple-mobile-web-app-title" content="어디고">
<meta name="application-name" content="어디고">
<meta name="theme-color" content="#f07a22">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/odigo.css?v=1.7">
</head>
<body>

<!-- 상단: 로고 + 검색 -->
<header class="topbar">
  <div class="logo">어디고</div>
  <form id="searchForm" class="search" autocomplete="off">
    <input id="searchInput" type="search" placeholder="장소·주소 검색 (예: 고령군청, 대가야읍 지산리 123)" enterkeyhint="search">
    <button type="submit" aria-label="검색">검색</button>
  </form>
</header>
<div id="searchResults" class="search-results" hidden></div>

<!-- 지도 -->
<div id="map"></div>

<!-- 지도 오른쪽 버튼 -->
<div class="fab-col">
  <button id="btnNearby" class="fab" title="주변정보"><span>🧭</span><small>주변정보</small></button>
  <button id="btnBase" class="fab" title="배경지도 전환"><span>🛰️</span><small>위성</small></button>
  <button id="btnLocate" class="fab" title="내 위치"><span>📍</span><small>내 위치</small></button>
</div>

<!-- 하단 바 -->
<nav class="bottombar">
  <button id="btnToday" class="bb-btn"><b>오늘 방문</b> <span id="cntToday">0</span></button>
  <button id="btnPlaces" class="bb-btn"><b>내 조사 장소</b> <span id="cntPlaces">0</span></button>
  <button id="btnInfo" class="bb-btn small" aria-label="정보">ⓘ</button>
</nav>

<!-- 접속 카운터 (텐아르 방식) -->
<div class="counter-strip" aria-label="접속 통계">
  실시간 <strong id="realtimeCount">…</strong> · 오늘 <strong id="todayCount">…</strong> · 누적 <strong id="totalCount">…</strong> · 조회 <strong id="pageviewCount">…</strong>
</div>

<!-- 하단 시트 (장소 목록·장소 카드·주변정보·정보 공용) -->
<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-head">
    <div id="sheetTitle" class="sheet-title"></div>
    <button id="sheetClose" class="sheet-close" aria-label="닫기">✕</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="js/nearby.js?v=1.7"></script>
<script src="js/odigo.js?v=1.7"></script>
</body>
</html>
